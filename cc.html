<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>李云祥 致 姜程程 · 圣诞快乐 🎄</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
                 -apple-system, BlinkMacSystemFont, sans-serif;
    background: #04050c;
    position: relative;
    -webkit-tap-highlight-color: transparent;
    animation: fadeIn 1.4s ease both;
  }
  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }

  /* ===== 背景光晕 ===== */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 110% 70% at 50% 112%, rgba(56, 98, 160, .45) 0%, rgba(56, 98, 160, 0) 62%),
      radial-gradient(ellipse 85% 60% at 50% 6%,  rgba(96, 62, 148, .22) 0%, rgba(96, 62, 148, 0) 60%),
      radial-gradient(ellipse at 50% 45%, #101a33 0%, #080c1a 48%, #04050c 100%);
    z-index: 0;
  }

  canvas { position: fixed; left: 0; top: 0; display: block; }
  #romance { z-index: 1; opacity: 1; transition: opacity 1.3s ease; }
  body.unlocked #romance { opacity: 0; }
  #bg   { z-index: 2; opacity: 0; transition: opacity 2.4s ease; }
  body.unlocked #bg { opacity: 1; }
  #tree { z-index: 3; opacity: 0; transform: scale(0.86) translateY(2%);
          transform-origin: 50% 88%;
          transition: opacity 2.2s ease, transform 2.6s cubic-bezier(.2, .8, .25, 1); }
  body.unlocked #tree { opacity: 1; transform: scale(1) translateY(0); }
  #fx   { z-index: 35; pointer-events: none; }

  /* ===== 初始邀请舞台（全屏居中） ===== */
  .stage-locked {
    position: fixed;
    inset: 0;
    z-index: 6;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    pointer-events: none;
    user-select: none;
    opacity: 1;
    transition: opacity .8s ease, visibility 0s 0s;
  }
  body.unlocked .stage-locked {
    opacity: 0;
    visibility: hidden;
    transition: opacity .8s ease, visibility 0s .8s;
  }

  .invite-inner {
    position: relative;
    z-index: 0;
    width: 100%;
    max-width: 680px;
    text-align: center;
    padding: 10px 0;
  }

  /* 名字背后的柔光 */
  .hero-glow {
    position: absolute;
    inset: -30% -18%;
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(255, 150, 200, .17) 0%,
      rgba(190, 150, 255, .09) 30%,
      rgba(120, 160, 255, .04) 50%,
      transparent 68%);
    animation: glowBreath 5.5s ease-in-out infinite;
    pointer-events: none;
    z-index: -1;
  }
  @keyframes glowBreath {
    0%, 100% { transform: scale(1); opacity: .75; }
    50%      { transform: scale(1.14); opacity: 1; }
  }

  /* 发件人标签 */
  .from-line {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 7px 20px;
    border-radius: 40px;
    border: 1px solid rgba(255, 200, 220, .30);
    background: rgba(255, 255, 255, .05);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    font-size: clamp(10px, 2.6vw, 12.5px);
    letter-spacing: .22em;
    text-indent: .22em;
    color: rgba(255, 220, 236, .9);
    text-shadow: 0 0 14px rgba(255, 150, 195, .7);
    opacity: 0;
    animation: fadeDown 1.1s .2s ease forwards;
    margin-bottom: 22px;
  }
  .from-line .heart {
    color: #ff8ab8;
    font-size: 1em;
    animation: heartBeat 1.6s ease-in-out infinite;
    text-shadow: 0 0 12px rgba(255, 110, 160, .9);
    letter-spacing: 0;
    text-indent: 0;
  }
  @keyframes heartBeat {
    0%, 100% { transform: scale(1); }
    25%      { transform: scale(1.28); }
    40%      { transform: scale(1); }
    60%      { transform: scale(1.18); }
  }

  /* 上方飘浮小心 */
  .hero-heart-float {
    font-size: clamp(16px, 4vw, 22px);
    color: rgba(255, 138, 176, .85);
    text-shadow: 0 0 18px rgba(255, 110, 160, .9);
    opacity: 0;
    animation: fadeDown 1.1s .45s ease forwards, floatHeart 3s 1.5s ease-in-out infinite;
    margin-bottom: 8px;
  }
  @keyframes floatHeart {
    0%, 100% { transform: translateY(0) scale(1); }
    50%      { transform: translateY(-8px) scale(1.15); }
  }

  .hero-merry {
    font-size: clamp(10px, 2.4vw, 14px);
    font-weight: 500;
    letter-spacing: .62em;
    text-indent: .62em;
    text-transform: uppercase;
    color: #ffd98a;
    text-shadow: 0 0 20px rgba(255, 200, 100, .85), 0 0 42px rgba(255, 170, 60, .45);
    opacity: 0;
    animation: fadeDown 1.1s .55s ease forwards;
    margin-bottom: 10px;
  }

  /* 名字两侧星光 */
  .hero-name-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(10px, 3vw, 26px);
    opacity: 0;
    animation: nameIn 1.4s .7s cubic-bezier(.2, .8, .25, 1) both;
  }
  .side-star {
    font-size: clamp(14px, 3vw, 22px);
    color: #ffd166;
    text-shadow: 0 0 14px rgba(255, 210, 110, .9), 0 0 30px rgba(255, 180, 80, .5);
    animation: starTwinkle 2.4s ease-in-out infinite;
  }
  .side-star.right { animation-delay: 1.2s; }
  @keyframes starTwinkle {
    0%, 100% { opacity: .45; transform: scale(.85) rotate(0deg); }
    50%      { opacity: 1;   transform: scale(1.15) rotate(180deg); }
  }

  .hero-name {
    display: inline-block;
    line-height: 1.1;
    font-size: clamp(54px, 16vw, 104px);
    font-weight: 800;
    letter-spacing: .08em;
    text-indent: .08em;
    background: linear-gradient(110deg, #ffe3ef 0%, #ffffff 20%, #ffb3d1 42%,
      #ff8ab8 60%, #ffffff 80%, #ffe3ef 100%);
    background-size: 260% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    animation: shimmer 6s linear infinite, heroBreathe 4s ease-in-out infinite;
  }
  @keyframes heroBreathe {
    0%, 100% { filter: drop-shadow(0 0 18px rgba(255, 120, 170, .45)); }
    50%      { filter: drop-shadow(0 0 44px rgba(255, 160, 205, .9)); }
  }
  @keyframes nameIn {
    from { opacity: 0; transform: translateY(24px) scale(.92); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes shimmer {
    0%   { background-position: 210% 0; }
    100% { background-position: -70% 0; }
  }

  .hero-sub {
    margin-top: 8px;
    font-size: clamp(13px, 3.4vw, 18px);
    letter-spacing: .38em;
    text-indent: .38em;
    color: rgba(255, 238, 248, .9);
    text-shadow: 0 0 20px rgba(255, 150, 195, .75);
    opacity: 0;
    animation: fadeDown 1.1s 1.1s ease forwards;
  }

  /* 心形分隔线 */
  .hero-divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin: 20px auto 16px;
    max-width: 340px;
    opacity: 0;
    animation: fadeDown 1.1s 1.3s ease forwards;
  }
  .hero-divider .line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255, 180, 215, .75), transparent);
  }
  .hero-divider .dot {
    font-size: 13px;
    color: #ff8ab8;
    text-shadow: 0 0 12px rgba(255, 110, 160, .9);
    animation: heartBeat 1.8s ease-in-out infinite;
  }

  .hero-invite {
    font-size: clamp(12px, 3vw, 15px);
    letter-spacing: .2em;
    text-indent: .2em;
    color: rgba(255, 226, 240, .82);
    text-shadow: 0 0 18px rgba(255, 140, 190, .7);
    line-height: 1.95;
    opacity: 0;
    animation: fadeDown 1.1s 1.5s ease forwards;
  }

  /* 答题按钮 */
  .start-quiz {
    display: inline-block;
    margin-top: 24px;
    padding: 15px 40px;
    font-size: clamp(14px, 3.5vw, 17px);
    font-weight: 700;
    letter-spacing: .16em;
    text-indent: .16em;
    color: #1a0e1e;
    background: linear-gradient(135deg, #ffd166, #ff8ab8 45%, #a78bfa 80%, #ffd166);
    background-size: 220% 220%;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    pointer-events: auto;
    opacity: 0;
    animation:
      fadeDown 1.1s 1.85s ease forwards,
      gradientShift 4s linear infinite,
      btnPulse 2.2s 2.4s ease-in-out infinite;
    box-shadow: 0 0 30px rgba(255, 150, 200, .55), 0 0 70px rgba(167, 139, 250, .35);
    transition: transform .22s, box-shadow .3s;
    font-family: inherit;
  }
  .start-quiz:hover {
    transform: scale(1.07);
    box-shadow: 0 0 44px rgba(255, 170, 210, .9), 0 0 90px rgba(167, 139, 250, .6);
  }
  .start-quiz:active { transform: scale(.96); }

  .unlock-hint {
    margin-top: 16px;
    font-size: clamp(11px, 2.8vw, 13px);
    letter-spacing: .14em;
    color: rgba(255, 214, 232, .55);
    text-shadow: 0 0 12px rgba(255, 140, 190, .4);
    opacity: 0;
    animation: fadeDown 1.1s 2.15s ease forwards;
  }

  @keyframes gradientShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  @keyframes btnPulse {
    0%, 100% { box-shadow: 0 0 24px rgba(255, 150, 200, .45), 0 0 54px rgba(167, 139, 250, .3); }
    50%      { box-shadow: 0 0 44px rgba(255, 175, 215, .9), 0 0 92px rgba(167, 139, 250, .6); }
  }
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ===== 解锁后的顶部舞台 ===== */
  .stage-unlocked {
    position: fixed;
    left: 0; right: 0;
    top: 5%;
    z-index: 5;
    text-align: center;
    padding: 0 20px;
    pointer-events: none;
    user-select: none;
    opacity: 0;
    transform: translateY(-14px);
    transition: opacity 1s ease .3s, transform 1s ease .3s;
  }
  body.unlocked .stage-unlocked {
    opacity: 1;
    transform: translateY(0);
  }

  .stage-unlocked .merry {
    font-size: clamp(10px, 2.4vw, 15px);
    font-weight: 500;
    letter-spacing: .58em;
    text-indent: .58em;
    text-transform: uppercase;
    color: #ffd98a;
    text-shadow: 0 0 20px rgba(255, 200, 100, .85), 0 0 42px rgba(255, 170, 60, .45);
  }
  .stage-unlocked .name {
    margin: 10px 0 8px;
    line-height: 1.1;
    font-size: clamp(42px, 13vw, 86px);
    font-weight: 800;
    letter-spacing: .1em;
    text-indent: .1em;
    background: linear-gradient(100deg, #ffd7e6 0%, #ffffff 18%, #ffb3d1 36%,
      #ff8ab8 56%, #ffffff 76%, #ffd7e6 100%);
    background-size: 260% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    animation: shimmer 7s linear infinite, heroBreathe 3.8s ease-in-out infinite;
  }
  .stage-unlocked .sub {
    font-size: clamp(12px, 3.2vw, 17px);
    letter-spacing: .34em;
    text-indent: .34em;
    color: rgba(255, 236, 246, .88);
    text-shadow: 0 0 18px rgba(255, 150, 195, .7);
  }
  .stage-unlocked .signature {
    margin-top: 14px;
    font-size: clamp(11px, 2.9vw, 14px);
    letter-spacing: .2em;
    text-indent: .2em;
    color: rgba(255, 214, 232, .82);
    text-shadow: 0 0 16px rgba(255, 140, 190, .65);
  }
  .stage-unlocked .signature b {
    font-weight: 700;
    color: #ffd166;
    text-shadow: 0 0 16px rgba(255, 200, 90, .85);
  }

  /* ===== 打字机祝福语 ===== */
  .typer {
    position: fixed;
    left: 0; right: 0;
    bottom: calc(4.5% + env(safe-area-inset-bottom, 0px));
    z-index: 6;
    text-align: center;
    padding: 0 26px;
    font-size: clamp(12px, 3.3vw, 16px);
    letter-spacing: .1em;
    line-height: 1.7;
    min-height: 1.8em;
    color: rgba(255, 224, 238, .82);
    text-shadow: 0 0 16px rgba(255, 140, 190, .55), 0 2px 10px rgba(0, 0, 0, .7);
    pointer-events: none;
  }
  body.locked .typer { display: none; }
  .typer::after {
    content: "";
    display: inline-block;
    width: 2px; height: 1em;
    margin-left: 4px;
    vertical-align: -.12em;
    background: rgba(255, 190, 215, .95);
    box-shadow: 0 0 8px rgba(255, 170, 205, .9);
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 0%, 50% { opacity: 1 } 50.01%, 100% { opacity: 0 } }

  /* ===== 音乐按钮 ===== */
  .music {
    position: fixed;
    right: 20px;
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    z-index: 40;
    width: 48px; height: 48px;
    border-radius: 50%;
    border: 1px solid rgba(255, 200, 220, .35);
    background: rgba(255, 255, 255, .06);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    color: #ffd9e6;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .3s, box-shadow .3s, transform .2s;
    box-shadow: 0 0 18px rgba(255, 140, 190, .22);
    outline: none;
    font-family: inherit;
  }
  .music:hover  { background: rgba(255, 255, 255, .14); transform: scale(1.06); }
  .music:active { transform: scale(.94); }
  .music.playing { animation: musicPulse 1.8s ease-in-out infinite; }
  @keyframes musicPulse {
    0%, 100% { box-shadow: 0 0 14px rgba(255, 140, 190, .3); }
    50%      { box-shadow: 0 0 38px rgba(255, 165, 205, .85); }
  }

  /* =========================================================
     答题覆盖层
  ========================================================= */
  .quiz-overlay {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(4, 5, 12, .74);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .55s ease;
  }
  .quiz-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }

  .quiz-card {
    position: relative;
    width: min(560px, 100%);
    padding: 30px 28px 24px;
    border-radius: 24px;
    background:
      radial-gradient(120% 80% at 50% 0%, rgba(80, 60, 120, .35) 0%, rgba(20, 24, 46, 0) 60%),
      linear-gradient(160deg, rgba(32, 40, 72, .95), rgba(14, 18, 38, .97));
    border: 1px solid rgba(255, 200, 220, .22);
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, .04) inset,
      0 0 50px rgba(255, 140, 190, .16),
      0 24px 70px rgba(0, 0, 0, .65);
    overflow: hidden;
    will-change: transform, opacity;
  }

  .quiz-card::before {
    content: "";
    position: absolute;
    inset: -2px;
    border-radius: 26px;
    background: conic-gradient(from var(--angle, 0deg),
      #ff6b9d, #ffd166, #4ecdc4, #a78bfa, #ff6b9d);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    padding: 2px;
    opacity: .65;
    animation: spinBorder 4s linear infinite;
    pointer-events: none;
  }
  @property --angle {
    syntax: '<angle>';
    initial-value: 0deg;
    inherits: false;
  }
  @keyframes spinBorder {
    to { --angle: 360deg; }
  }

  .quiz-card::after {
    content: "";
    position: absolute;
    left: 0; right: 0;
    top: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(255, 210, 230, .9), transparent);
    animation: scanDown 3.4s linear infinite;
    pointer-events: none;
  }
  @keyframes scanDown {
    0%   { top: 0; opacity: 0; }
    8%   { opacity: 1; }
    92%  { opacity: 1; }
    100% { top: 100%; opacity: 0; }
  }

  .quiz-from {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    margin-bottom: 14px;
    font-size: 11.5px;
    letter-spacing: .18em;
    color: rgba(255, 200, 225, .7);
    text-shadow: 0 0 12px rgba(255, 140, 190, .5);
  }
  .quiz-from .heart { color: #ff8ab8; font-size: 11px; }

  .quiz-progress {
    height: 4px;
    border-radius: 4px;
    background: rgba(255, 255, 255, .08);
    overflow: hidden;
    margin-bottom: 18px;
  }
  .quiz-progress-bar {
    height: 100%;
    width: 0%;
    border-radius: 4px;
    background: linear-gradient(90deg, #ff6b9d, #ffd166, #4ecdc4, #ff6b9d);
    background-size: 200% 100%;
    box-shadow: 0 0 12px rgba(255, 140, 190, .9);
    transition: width .55s cubic-bezier(.2, .9, .3, 1.2);
    animation: gradientShift 3s linear infinite;
  }

  .quiz-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
    font-size: 13px;
    letter-spacing: .08em;
    color: rgba(200, 215, 255, .65);
  }
  .quiz-score b {
    display: inline-block;
    color: #ffd166;
    font-size: 16px;
    text-shadow: 0 0 12px rgba(255, 200, 90, .8);
    transition: transform .3s;
  }
  .quiz-score b.bump { animation: scoreBump .45s ease; }
  @keyframes scoreBump {
    0%   { transform: scale(1); }
    45%  { transform: scale(1.6); color: #7dffcf; }
    100% { transform: scale(1); }
  }

  .quiz-question {
    font-size: clamp(17px, 4.4vw, 21px);
    font-weight: 700;
    line-height: 1.55;
    color: #fff2f8;
    letter-spacing: .04em;
    margin-bottom: 20px;
    text-shadow: 0 0 24px rgba(255, 150, 200, .35);
    min-height: 1.5em;
  }

  .quiz-options {
    display: flex;
    flex-direction: column;
    gap: 11px;
  }

  .quiz-option {
    position: relative;
    width: 100%;
    padding: 15px 20px;
    text-align: left;
    font-family: inherit;
    font-size: clamp(14px, 3.6vw, 16px);
    letter-spacing: .04em;
    color: #ffe8f2;
    background: linear-gradient(135deg, rgba(255, 255, 255, .06), rgba(255, 255, 255, .015));
    border: 1px solid rgba(255, 180, 210, .22);
    border-radius: 14px;
    cursor: pointer;
    overflow: hidden;
    transition: transform .28s cubic-bezier(.2, .9, .3, 1.2),
                border-color .28s, background .28s, box-shadow .28s;
    outline: none;
  }
  .quiz-option::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(110deg, transparent 30%, rgba(255, 255, 255, .13) 50%, transparent 70%);
    transform: translateX(-120%);
    transition: transform .55s;
    pointer-events: none;
  }
  .quiz-option:hover {
    transform: translateX(7px);
    border-color: rgba(255, 140, 190, .75);
    background: linear-gradient(135deg, rgba(255, 140, 190, .17), rgba(255, 200, 120, .07));
    box-shadow: 0 0 22px rgba(255, 140, 190, .3);
  }
  .quiz-option:hover::before { transform: translateX(120%); }

  .quiz-option.correct {
    background: linear-gradient(135deg, rgba(80, 240, 160, .35), rgba(40, 200, 130, .18));
    border-color: rgba(120, 255, 190, .9);
    box-shadow: 0 0 32px rgba(80, 240, 160, .6), 0 0 60px rgba(80, 240, 160, .25);
    color: #eafff6;
    animation: correctPulse .55s ease;
  }
  @keyframes correctPulse {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.035); }
    100% { transform: scale(1); }
  }

  .quiz-option.wrong {
    background: linear-gradient(135deg, rgba(255, 80, 120, .35), rgba(200, 40, 80, .18));
    border-color: rgba(255, 110, 150, .9);
    box-shadow: 0 0 32px rgba(255, 80, 120, .5);
    animation: wrongShake .5s ease;
  }
  @keyframes wrongShake {
    0%, 100% { transform: translateX(0); }
    20%      { transform: translateX(-9px); }
    40%      { transform: translateX(8px); }
    60%      { transform: translateX(-6px); }
    80%      { transform: translateX(4px); }
  }

  .quiz-option.dimmed {
    opacity: .35;
    transform: scale(.98);
  }

  .quiz-feedback {
    margin-top: 18px;
    min-height: 24px;
    text-align: center;
    font-size: clamp(13px, 3.4vw, 15px);
    letter-spacing: .06em;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity .35s, transform .35s;
  }
  .quiz-feedback.show {
    opacity: 1;
    transform: translateY(0);
  }
  .quiz-feedback.good {
    color: #7dffcf;
    text-shadow: 0 0 16px rgba(80, 240, 160, .8);
  }
  .quiz-feedback.bad {
    color: #ff9fb8;
    text-shadow: 0 0 16px rgba(255, 80, 120, .7);
  }

  /* ===== 结果页 ===== */
  .result {
    text-align: center;
    padding: 8px 0 4px;
  }
  .result-emoji {
    font-size: 58px;

<script>
(function () {
  'use strict';

  /* =========================================================
     基础
  ========================================================= */
  var romanceCanvas = document.getElementById('romance');
  var bgCanvas      = document.getElementById('bg');
  var treeCanvas    = document.getElementById('tree');
  var fxCanvas      = document.getElementById('fx');
  var romanceCtx    = romanceCanvas.getContext('2d');
  var bgCtx         = bgCanvas.getContext('2d');
  var treeCtx       = treeCanvas.getContext('2d');
  var fxCtx         = fxCanvas.getContext('2d');

  var W = 0, H = 0, DPR = 1;
  var unlocked = false;

  /* =========================================================
     装饰配色
  ========================================================= */
  var DECOR_COLORS = [
    { hex: '#ff6b8a', rgb: '255,107,138' },
    { hex: '#ffd166', rgb: '255,209,102' },
    { hex: '#6bcbff', rgb: '107,203,255' },
    { hex: '#ff9fdd', rgb: '255,159,221' },
    { hex: '#7dffcf', rgb: '125,255,207' },
    { hex: '#c9a4ff', rgb: '201,164,255' }
  ];

  var sprites = {};

  function makeOrbSprite(rgb) {
    var s = 64;
    var c = document.createElement('canvas');
    c.width = c.height = s;
    var g = c.getContext('2d');
    var grd = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    grd.addColorStop(0,    'rgba(255,255,255,1)');
    grd.addColorStop(0.16, 'rgba(' + rgb + ',0.95)');
    grd.addColorStop(0.42, 'rgba(' + rgb + ',0.28)');
    grd.addColorStop(1,    'rgba(' + rgb + ',0)');
    g.fillStyle = grd;
    g.fillRect(0, 0, s, s);
    return c;
  }

  function makeStarSprite(rgb) {
    var s = 64;
    var c = document.createElement('canvas');
    c.width = c.height = s;
    var g = c.getContext('2d');

    var grd = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    grd.addColorStop(0,    'rgba(255,255,255,0.55)');
    grd.addColorStop(0.35, 'rgba(' + rgb + ',0.28)');
    grd.addColorStop(1,    'rgba(' + rgb + ',0)');
    g.fillStyle = grd;
    g.fillRect(0, 0, s, s);

    g.translate(s / 2, s / 2);
    g.beginPath();
    for (var i = 0; i < 10; i++) {
      var ang = (Math.PI / 5) * i - Math.PI / 2;
      var rad = i % 2 === 0 ? s * 0.34 : s * 0.14;
      var x = Math.cos(ang) * rad;
      var y = Math.sin(ang) * rad;
      if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
    }
    g.closePath();
    var lg = g.createLinearGradient(-s * 0.3, -s * 0.3, s * 0.3, s * 0.3);
    lg.addColorStop(0,   '#ffffff');
    lg.addColorStop(0.5, 'rgba(' + rgb + ',1)');
    lg.addColorStop(1,   '#ffffff');
    g.fillStyle = lg;
    g.fill();
    return c;
  }

  function makeFlakeSprite(rgb) {
    var s = 64;
    var c = document.createElement('canvas');
    c.width = c.height = s;
    var g = c.getContext('2d');

    var grd = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    grd.addColorStop(0,    'rgba(255,255,255,0.5)');
    grd.addColorStop(0.35, 'rgba(' + rgb + ',0.25)');
    grd.addColorStop(1,    'rgba(' + rgb + ',0)');
    g.fillStyle = grd;
    g.fillRect(0, 0, s, s);

    g.translate(s / 2, s / 2);
    g.strokeStyle = 'rgba(' + rgb + ',1)';
    g.lineWidth = s * 0.045;
    g.lineCap = 'round';
    for (var i = 0; i < 6; i++) {
      g.save();
      g.rotate(i * Math.PI / 3);
      g.beginPath();
      g.moveTo(0, 0);
      g.lineTo(0, -s * 0.33);
      g.stroke();
      g.beginPath();
      g.moveTo(0, -s * 0.19);
      g.lineTo(s * 0.105, -s * 0.28);
      g.moveTo(0, -s * 0.19);
      g.lineTo(-s * 0.105, -s * 0.28);
      g.stroke();
      g.restore();
    }
    g.fillStyle = '#ffffff';
    g.beginPath();
    g.arc(0, 0, s * 0.055, 0, Math.PI * 2);
    g.fill();
    return c;
  }

  DECOR_COLORS.forEach(function (c) {
    sprites['orb_' + c.rgb]   = makeOrbSprite(c.rgb);
    sprites['star_' + c.rgb]  = makeStarSprite(c.rgb);
    sprites['flake_' + c.rgb] = makeFlakeSprite(c.rgb);
  });
  function getSprite(type, colorObj) {
    return sprites[type + '_' + colorObj.rgb] || null;
  }

  /* =========================================================
     状态
  ========================================================= */
  var leaves = [], baubles = [], ribbons = [], gifts = [];
  var stars = [], flakes = [], hearts = [];
  var romanceParticles = [];
  var starInfo = { x: 0, y: 0, r: 10 };
  var treeTrunk = { x: 0, topY: 0, bottomY: 0, w: 10 };
  var fxParticles = [];
  var romanceActive = true;

  /* =========================================================
     工具
  ========================================================= */
  function shadeColor(hex, amt) {
    var c = hex.replace('#', '');
    if (c.length === 3) c = c[0] + c[0] + c[1] + c[1] + c[2] + c[2];
    var r = parseInt(c.substr(0, 2), 16);
    var g = parseInt(c.substr(2, 2), 16);
    var b = parseInt(c.substr(4, 2), 16);
    r = Math.max(0, Math.min(255, Math.round(r + 255 * amt)));
    g = Math.max(0, Math.min(255, Math.round(g + 255 * amt)));
    b = Math.max(0, Math.min(255, Math.round(b + 255 * amt)));
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  function roundRect(ctx, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function heartPath(ctx, cx, cy, size) {
    var k = size / 16;
    ctx.beginPath();
    for (var i = 0; i <= 36; i++) {
      var t = (i / 36) * Math.PI * 2;
      var x = 16 * Math.pow(Math.sin(t), 3);
      var y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      var px = cx + x * k;
      var py = cy + y * k;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
  }

  /* =========================================================
     尺寸 / 重建
  ========================================================= */
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;

    [romanceCanvas, bgCanvas, treeCanvas, fxCanvas].forEach(function (c) {
      c.width  = Math.round(W * DPR);
      c.height = Math.round(H * DPR);
      c.style.width  = W + 'px';
      c.style.height = H + 'px';
    });
    romanceCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
    bgCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
    treeCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
    fxCtx.setTransform(DPR, 0, 0, DPR, 0, 0);

    buildRomance();
    buildBackground();
    buildTree();
  }

  /* =========================================================
     浪漫粒子（初始界面）
  ========================================================= */
  function makeRomanceParticle(init) {
    var roll = Math.random();
    var type = roll < 0.4 ? 'heart' : (roll < 0.76 ? 'spark' : 'orb');
    return {
      type: type,
      x: Math.random() * W,
      y: init ? Math.random() * H : H + 30,
      size: type === 'heart' ? 4 + Math.random() * 7 :
            type === 'spark' ? 1 + Math.random() * 2 :
            8 + Math.random() * 18,
      vy: -(0.15 + Math.random() * 0.45),
      vx: (Math.random() - 0.5) * 0.2,
      phase: Math.random() * Math.PI * 2,
      swingSpeed: 0.005 + Math.random() * 0.01,
      alpha: type === 'heart' ? 0.2 + Math.random() * 0.35 :
             type === 'spark' ? 0.3 + Math.random() * 0.5 :
             0.06 + Math.random() * 0.12,
      warm: Math.random() < 0.5
    };
  }

  function buildRomance() {
    romanceParticles = [];
    var n = Math.round(Math.min(70, W * H / 14000));
    for (var i = 0; i < n; i++) {
      romanceParticles.push(makeRomanceParticle(true));
    }
  }

  function drawRomance(time, dt) {
    if (!romanceActive) return;
    var ctx = romanceCtx;
    ctx.clearRect(0, 0, W, H);

    for (var i = 0; i < romanceParticles.length; i++) {
      var p = romanceParticles[i];
      p.y += p.vy * dt;
      p.phase += p.swingSpeed * dt;
      p.x += p.vx * dt + Math.sin(p.phase) * 0.4 * dt;

      if (p.y < -40) {
        romanceParticles[i] = makeRomanceParticle(false);
        continue;
      }

      var alpha = p.alpha * (0.7 + 0.3 * Math.sin(time * 0.0016 + p.phase));

      if (p.type === 'heart') {
        ctx.save();
        ctx.fillStyle = 'rgba(255, 138, 176, ' + alpha + ')';
        heartPath(ctx, p.x, p.y, p.size);
        ctx.fill();
        ctx.restore();
      } else if (p.type === 'spark') {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        var tw = 0.4 + 0.6 * Math.abs(Math.sin(time * 0.003 + p.phase));
        ctx.fillStyle = p.warm
          ? 'rgba(255, 220, 140, ' + (alpha * tw) + ')'
          : 'rgba(255, 200, 230, ' + (alpha * tw) + ')';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        if (p.size > 1.8) {
          ctx.strokeStyle = 'rgba(255, 240, 200, ' + (alpha * tw * 0.8) + ')';
          ctx.lineWidth = 0.8;
          ctx.beginPath();
          ctx.moveTo(p.x - p.size * 2.2, p.y);
          ctx.lineTo(p.x + p.size * 2.2, p.y);
          ctx.moveTo(p.x, p.y - p.size * 2.2);
          ctx.lineTo(p.x, p.y + p.size * 2.2);
          ctx.stroke();
        }
        ctx.restore();
      } else {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        var grd = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
        grd.addColorStop(0,    'rgba(255, 180, 210, ' + alpha + ')');
        grd.addColorStop(0.5,  'rgba(200, 150, 255, ' + (alpha * 0.4) + ')');
        grd.addColorStop(1,    'rgba(200, 150, 255, 0)');
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }
  }

  /* =========================================================
     背景（解锁后）
  ========================================================= */
  function buildBackground() {
    stars = [];
    var sc = Math.round(Math.min(180, W * H / 9000));
    for (var i = 0; i < sc; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H * 0.9,
        r: Math.random() * 1.3 + 0.25,
        phase: Math.random() * Math.PI * 2,
        speed: 0.6 + Math.random() * 1.8
      });
    }

    flakes = [];
    var fc = Math.round(Math.min(150, W * H / 11000));
    for (var j = 0; j < fc; j++) flakes.push(makeFlake(true));

    hearts = [];
    for (var k = 0; k < 12; k++) hearts.push(makeHeart(true));
  }

  function makeFlake(init) {
    return {
      x: Math.random() * W,
      y: init ? Math.random() * H : -20,
      r: Math.random() * 2.0 + 0.6,
      vy: Math.random() * 0.55 + 0.22,
      vx: (Math.random() - 0.5) * 0.3,
      swing: Math.random() * Math.PI * 2,
      swingSpeed: Math.random() * 0.018 + 0.006,
      alpha: Math.random() * 0.45 + 0.35
    };
  }

  function makeHeart(init) {
    return {
      x: Math.random() * W,
      y: init ? Math.random() * H : H + 40,
      size: Math.random() * 9 + 7,
      vy: -(Math.random() * 0.45 + 0.2),
      vx: (Math.random() - 0.5) * 0.22,
      phase: Math.random() * Math.PI * 2,
      alpha: Math.random() * 0.28 + 0.16
    };
  }

  /* =========================================================
     圣诞树构建
  ========================================================= */
  function buildTree() {
    var cx      = W / 2;
    var bottomY = H * 0.87;
    var treeH   = H * 0.55;
    var topY    = bottomY - treeH;
    var maxR    = Math.min(W * 0.36, treeH * 0.55);

    starInfo = {
      x: cx,
      y: topY - Math.max(10, treeH * 0.045),
      r: Math.max(9, Math.min(W, H) * 0.024)
    };

    treeTrunk = {
      x: cx,
      topY: topY + treeH * 0.76,
      bottomY: bottomY + treeH * 0.06,
      w: Math.max(14, maxR * 0.11)
    };

    leaves = [];
    var N = Math.min(1800, Math.round(treeH * 3.4));
    var turns = 22;

    for (var i = 0; i < N; i++) {
      var t = Math.pow(i / N, 0.85);
      var y = topY + t * treeH;
      var baseR = Math.pow(t, 1.05) * maxR;
      var ang = t * Math.PI * 2 * turns + (Math.random() - 0.5) * 0.7;
      var rr = baseR * (0.62 + Math.random() * 0.42);
      var x = cx + Math.cos(ang) * rr;
      var z = Math.sin(ang);
      var radial = baseR > 0.01 ? rr / baseR : 0;

      leaves.push({
        x: x, y: y, z: z,
        size: 0.5 + Math.random() * 1.4,
        phase: Math.random() * Math.PI * 2,
        light: 0.22 + ((z + 1) / 2) * 0.55 + (1 - radial) * 0.20,
        hue: 136 + Math.random() * 30,
        sat: 55 + Math.random() * 30,
        lum: 20 + ((z + 1) / 2) * 26 + (1 - radial) * 8,
        warm: Math.random() < 0.07
      });
    }
    leaves.sort(function (a, b) { return a.z - b.z; });

    ribbons = [];
    var rc = Math.min(260, Math.round(treeH * 1.1));
    for (var r = 0; r < rc; r++) {
      var tr = r / (rc - 1);
      var yr = topY + tr * treeH;
      var baseRr = Math.pow(tr, 1.05) * maxR;
      var angR = tr * Math.PI * 2 * 5 + 0.3;
      var xr = cx + Math.cos(angR) * baseRr * 0.96;
      var zr = Math.sin(angR);
      ribbons.push({
        x: xr, y: yr, z: zr,
        size: (1.0 + Math.random() * 0.9) * (0.6 + tr * 0.7),
        phase: tr * Math.PI * 2 * 3
      });
    }
    ribbons.sort(function (a, b) { return a.z - b.z; });

    baubles = [];
    var bn = Math.round(Math.min(92, 50 + treeH * 0.06));
    for (var j = 0; j < bn; j++) {
      var t2 = Math.pow((j + 0.5) / bn, 0.9);
      var y2 = topY + t2 * treeH * 0.96 + treeH * 0.02;
      var baseR2 = Math.pow(t2, 1.05) * maxR;
      var ang2 = t2 * Math.PI * 2 * 7 + (Math.random() - 0.5) * 0.5;
      var rr2 = baseR2 * (0.88 + Math.random() * 0.16);
      var x2 = cx + Math.cos(ang2) * rr2;
      var z2 = Math.sin(ang2);

      var colObj = DECOR_COLORS[(Math.random() * DECOR_COLORS.length) | 0];
      var roll = Math.random();
      var type = roll < 0.55 ? 'orb' : (roll < 0.82 ? 'star' : 'flake');

      baubles.push({
        x: x2, y: y2, z: z2,
        color: colObj,
        type: type,
        size: type === 'orb' ? 4.5 + Math.random() * 5 : 5 + Math.random() * 4,
        phase: Math.random() * Math.PI * 2,
        speed: 0.7 + Math.random() * 1.6
      });
    }
    baubles.sort(function (a, b) { return a.z - b.z; });

    gifts = [];
    var giftPalette = [
      { box: '#e8455f', ribbon: '#ffd166' },
      { box: '#3a6ea5', ribbon: '#ff9fdd' },
      { box: '#7d5ba6', ribbon: '#7dffcf' },
      { box: '#2a8a6a', ribbon: '#ffd166' }
    ];
    var gn = 4;
    var baseW = Math.max(22, maxR * 0.20);
    for (var g = 0; g < gn; g++) {
      var gw = baseW * (0.7 + Math.random() * 0.55);
      var gh = gw * (0.62 + Math.random() * 0.22);
      var gx = cx + (g - (gn - 1) / 2) * baseW * 1.35 + (Math.random() - 0.5) * 12;
      var gy = bottomY + treeH * 0.02 + (Math.random() - 0.5) * 6;
      gifts.push({
        x: gx, y: gy, w: gw, h: gh,
        colors: giftPalette[g % giftPalette.length],
        rot: (Math.random() - 0.5) * 0.14
      });
    }
    gifts.sort(function (a, b) { return b.y - a.y; });
  }

  /* =========================================================
     绘制：树干 / 礼物 / 彩带 / 挂饰
  ========================================================= */
  function drawTrunk(ctx) {
    var tr = treeTrunk;
    var g = ctx.createLinearGradient(tr.x - tr.w / 2, 0, tr.x + tr.w / 2, 0);
    g.addColorStop(0,    'rgba(52, 34, 24, 0.95)');
    g.addColorStop(0.35, 'rgba(108, 74, 50, 0.98)');
    g.addColorStop(0.65, 'rgba(92, 62, 42, 0.98)');
    g.addColorStop(1,    'rgba(42, 28, 18, 0.95)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(tr.x - tr.w / 2, tr.bottomY);
    ctx.lineTo(tr.x - tr.w * 0.32, tr.topY);
    ctx.lineTo(tr.x + tr.w * 0.32, tr.topY);
    ctx.lineTo(tr.x + tr.w / 2, tr.bottomY);
    ctx.closePath();
    ctx.fill();
  }

  function drawGifts(ctx) {
    for (var i = 0; i < gifts.length; i++) {
      var g = gifts[i];
      var w = g.w, h = g.h;

      ctx.save();
      ctx.translate(g.x, g.y);
      ctx.rotate(g.rot);

      ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
      ctx.beginPath();
      ctx.ellipse(0, 3, w * 0.55, h * 0.18, 0, 0, Math.PI * 2);
      ctx.fill();

      var grd = ctx.createLinearGradient(-w / 2, -h, w / 2, 0);
      grd.addColorStop(0,   shadeColor(g.colors.box, 0.22));
      grd.addColorStop(0.5, g.colors.box);
      grd.addColorStop(1,   shadeColor(g.colors.box, -0.35));
      ctx.fillStyle = grd;
      roundRect(ctx, -w / 2, -h, w, h, w * 0.08);
      ctx.fill();

      ctx.fillStyle = g.colors.ribbon;
      ctx.fillRect(-w * 0.055, -h, w * 0.11, h);
      ctx.fillRect(-w / 2, -h * 0.6, w, h * 0.11);

      ctx.save();
      ctx.translate(0, -h);
      ctx.fillStyle = shadeColor(g.colors.ribbon, 0.1);
      ctx.beginPath();
      ctx.ellipse(-w * 0.16, -h * 0.06, w * 0.15, h * 0.13, -0.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(w * 0.16, -h * 0.06, w * 0.15, h * 0.13, 0.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = g.colors.ribbon;
      ctx.beginPath();
      ctx.arc(0, -h * 0.02, w * 0.07, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      ctx.fillStyle = 'rgba(255, 255, 255, 0.10)';
      roundRect(ctx, -w / 2 + w * 0.08, -h + h * 0.08, w * 0.32, h * 0.22, w * 0.04);
      ctx.fill();

      ctx.restore();
    }
  }

  function drawRibbons(ctx, time) {
    if (!ribbons.length) return;
    var sp = sprites['orb_255,209,102'];
    if (!sp) return;

    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < ribbons.length; i++) {
      var r = ribbons[i];
      var tw = 0.55 + 0.45 * Math.sin(time * 0.0025 + r.phase);
      ctx.globalAlpha = 0.10 + tw * 0.34;
      var s = r.size * 3.2;
      ctx.drawImage(sp, r.x - s / 2, r.y - s / 2, s, s);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawBaubles(ctx, time) {
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < baubles.length; i++) {
      var b = baubles[i];
      var tw = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(time * 0.0021 * b.speed + b.phase));
      var sp = getSprite(b.type, b.color);
      if (!sp) continue;
      var s = b.size * (b.type === 'orb' ? 2.6 : 2.2) * (0.85 + tw * 0.3);
      ctx.globalAlpha = 0.12 + tw * 0.76;
      ctx.drawImage(sp, b.x - s / 2, b.y - s / 2, s, s);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawTree(time) {
    var ctx = treeCtx;
    ctx.clearRect(0, 0, W, H);

    var cx = W / 2;
    var groundY = H * 0.87;
    var glowR = Math.min(W * 0.62, 560);

    var g = ctx.createRadialGradient(cx, groundY, 0, cx, groundY, glowR);
    g.addColorStop(0,    'rgba(120, 190, 255, 0.11)');
    g.addColorStop(0.4,  'rgba(90, 150, 230, 0.05)');
    g.addColorStop(1,    'rgba(90, 150, 230, 0)');
    ctx.fillStyle = g;
    ctx.fillRect(cx - glowR, groundY - glowR, glowR * 2, glowR * 2);

    var ellW = Math.min(W * 0.34, 300);
    var ellH = Math.min(W * 0.08, 60);
    var ell = ctx.createRadialGradient(cx, groundY + 8, 0, cx, groundY + 8, ellW);
    ell.addColorStop(0, 'rgba(160, 220, 255, 0.12)');
    ell.addColorStop(1, 'rgba(160, 220, 255, 0)');
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = ell;
    ctx.beginPath();
    ctx.ellipse(cx, groundY + 8, ellW, ellH, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    drawTrunk(ctx);
    drawGifts(ctx);

    for (var i = 0; i < leaves.length; i++) {
      var p = leaves[i];
      var tw = 0.78 + 0.22 * Math.sin(time * 0.0015 + p.phase);
      var a = (0.12 + p.light * 0.60) * tw;
      var hue = p.warm ? 45 : p.hue;
      var sat = p.warm ? 90 : p.sat;
      var lum = p.warm ? p.lum + 18 : p.lum;
      ctx.fillStyle = 'hsla(' + hue + ', ' + sat + '%, ' + lum + '%, ' + a + ')';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * (0.7 + p.light * 0.5), 0, Math.PI * 2);
      ctx.fill();
    }

    drawRibbons(ctx, time);
    drawBaubles(ctx, time);
    drawStar(ctx, starInfo.x, starInfo.y, starInfo.r, time);
  }

  function drawStar(ctx, x, y, r, time) {
    var pulse = 0.85 + 0.15 * Math.sin(time * 0.0028);
    var rot = time * 0.0008;

    ctx.globalCompositeOperation = 'lighter';

    var haloR = r * 4.6 * pulse;
    var g = ctx.createRadialGradient(x, y, 0, x, y, haloR);
    g.addColorStop(0,    'rgba(255, 255, 240, 0.95)');
    g.addColorStop(0.18, 'rgba(255, 226, 150, 0.62)');
    g.addColorStop(0.48, 'rgba(255, 200, 90, 0.20)');
    g.addColorStop(1,    'rgba(255, 190, 70, 0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, haloR, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    for (var i = 0; i < 8; i++) {
      ctx.rotate(Math.PI / 4);
      var len = r * (i % 2 === 0 ? 6.2 : 3.6) * pulse;
      var wid = r * (i % 2 === 0 ? 0.13 : 0.09);
      var lg = ctx.createLinearGradient(0, 0, len, 0);
      lg.addColorStop(0,   'rgba(255, 250, 220, 0.85)');
      lg.addColorStop(0.5, 'rgba(255, 225, 140, 0.35)');
      lg.addColorStop(1,   'rgba(255, 210, 110, 0)');
      ctx.fillStyle = lg;
      ctx.beginPath();
      ctx.moveTo(0, -wid);
      ctx.lineTo(len, 0);
      ctx.lineTo(0, wid);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();

    ctx.save();
    ctx.translate(x, y);
    ctx.beginPath();
    for (var k = 0; k < 10; k++) {
      var ang = (Math.PI / 5) * k - Math.PI / 2;
      var rad = (k % 2 === 0 ? r : r * 0.42) * pulse;
      var px = Math.cos(ang) * rad;
      var py = Math.sin(ang) * rad;
      if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    var sg = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
    sg.addColorStop(0,   'rgba(255, 255, 255, 1)');
    sg.addColorStop(0.5, 'rgba(255, 244, 200, 1)');
    sg.addColorStop(1,   'rgba(255, 214, 120, 0.95)');
    ctx.fillStyle = sg;
    ctx.fill();
    ctx.restore();

    ctx.globalCompositeOperation = 'source-over';
  }

  function drawBg(time, dt) {
    var ctx = bgCtx;
    ctx.clearRect(0, 0, W, H);

    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var tw = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(time * 0.001 * s.speed + s.phase));
      ctx.fillStyle = 'rgba(198, 218, 255, ' + (0.10 + tw * 0.6) + ')';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }

    for (var j = 0; j < hearts.length; j++) {
      var h = hearts[j];
      h.y += h.vy * dt;
      h.x += h.vx * dt + Math.sin(time * 0.0012 + h.phase) * 0.35 * dt;

      if (h.y < -50) { hearts[j] = makeHeart(false); continue; }

      var a = h.alpha * (0.6 + 0.4 * Math.sin(time * 0.002 + h.phase));
      ctx.save();
      ctx.fillStyle = 'rgba(255, 138, 176, ' + a + ')';
      heartPath(ctx, h.x, h.y, h.size);
      ctx.fill();
      ctx.restore();
    }

    for (var k = 0; k < flakes.length; k++) {
      var f = flakes[k];
      f.y += f.vy * dt;
      f.swing += f.swingSpeed * dt;
      f.x += f.vx * dt + Math.sin(f.swing) * 0.45 * dt;

      if (f.y > H + 20) { flakes[k] = makeFlake(false); continue; }
      if (f.x < -20) f.x = W + 20;
      if (f.x > W + 20) f.x = -20;

      ctx.fillStyle = 'rgba(232, 244, 255, ' + f.alpha + ')';
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  /* =========================================================
     特效粒子
  ========================================================= */
  function burst(x, y, colors, count) {
    for (var i = 0; i < count; i++) {
      var ang = Math.random() * Math.PI * 2;
      var sp = Math.random() * 7.5 + 2;
      fxParticles.push({
        x: x, y: y,
        vx: Math.cos(ang) * sp,
        vy: Math.sin(ang) * sp - 2.5,
        life: 1,
        decay: 0.016 + Math.random() * 0.022,
        size: Math.random() * 4.2 + 1.8,
        color: colors[(Math.random() * colors.length) | 0],
        gravity: 0.16,
        isConfetti: false
      });
    }
  }

  function confetti() {
    var colors = ['#ff6b9d', '#ffd166', '#4ecdc4', '#a78bfa', '#ff8a5b', '#5eead4', '#ffffff'];
    for (var i = 0; i < 140; i++) {
      fxParticles.push({
        x: Math.random() * W,
        y: -30 - Math.random() * H * 0.5,
        vx: (Math.random() - 0.5) * 2.5,
        vy: Math.random() * 3 + 2.5,
        life: 1,
        decay: 0.0045,
        size: Math.random() * 7 + 3,
        color: colors[(Math.random() * colors.length) | 0],
        gravity: 0.05,
        rotation: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.22,
        isConfetti: true
      });
    }
  }

  function drawFx(dt) {
    fxCtx.clearRect(0, 0, W, H);
    if (!fxParticles.length) return;

    fxCtx.globalCompositeOperation = 'lighter';

    for (var i = fxParticles.length - 1; i >= 0; i--) {
      var p = fxParticles[i];

      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += p.gravity * dt;
      p.vx *= 0.985;
      p.life -= p.decay * dt;

      if (p.life <= 0 || p.y > H + 60) {
        fxParticles.splice(i, 1);
        continue;
      }

      fxCtx.globalAlpha = Math.max(0, p.life);

      if (p.isConfetti) {
        fxCtx.save();
        fxCtx.translate(p.x, p.y);
        fxCtx.rotate(p.rotation);
        fxCtx.fillStyle = p.color;
        fxCtx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
        fxCtx.restore();
        p.rotation += p.rotSpeed * dt;
      } else {
        fxCtx.fillStyle = p.color;
        fxCtx.beginPath();
        fxCtx.arc(p.x, p.y, p.size * Math.max(0.1, p.life), 0, Math.PI * 2);
        fxCtx.fill();
      }
    }

    fxCtx.globalAlpha = 1;
    fxCtx.globalCompositeOperation = 'source-over';
  }

  /* =========================================================
     主循环
  ========================================================= */
  var startTime = 0;
  var lastTime  = 0;

  function loop(now) {
    if (!startTime) { startTime = now; lastTime = now; }
    var time = now - startTime;
    var dt = Math.min((now - lastTime) / 16.667, 3);
    lastTime = now;

    if (romanceActive) drawRomance(time, dt);
    if (unlocked) {
      drawBg(time, dt);
      drawTree(time);
    }
    drawFx(dt);

    requestAnimationFrame(loop);
  }

  var NOTE_FREQ = {
    C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23,
    G4: 392.00, A4: 440.00, B4: 493.88, C5: 523.25
  };

  var MELODY = [
    ['E4',1],['E4',1],['E4',2],
    ['E4',1],['E4',1],['E4',2],
    ['E4',1],['G4',1],['C4',1],['D4',1],['E4',4],
    ['F4',1],['F4',1],['F4',1],['F4',1],['F4',1],['E4',1],['E4',1],['E4',.5],['E4',.5],
    ['E4',1],['D4',1],['D4',1],['E4',1],['D4',2],['G4',2],
    ['E4',1],['E4',1],['E4',2],
    ['E4',1],['E4',1],['E4',2],
    ['E4',1],['G4',1],['C4',1],['D4',1],['E4',4],
    ['F4',1],['F4',1],['F4',1],['F4',1],['F4',1],['E4',1],['E4',1],['E4',.5],['E4',.5],
    ['G4',1],['G4',1],['F4',1],['D4',1],['C4',4]
  ];

  function playNote(ctx, freq, start, dur) {
    var osc  = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, start);
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(0.16, start + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(start);
    osc.stop(start + dur + 0.05);
  }

  function scheduleMelody() {
    if (!musicOn || !audioCtx) return;
    var ctx  = audioCtx;
    var unit = 0.34;
    var t = ctx.currentTime + 0.15;
    var total = 0;

    MELODY.forEach(function (item) {
      var d = item[1] * unit;
      playNote(ctx, NOTE_FREQ[item[0]], t, d * 0.85);
      t += d;
      total += d;
    });

    melodyTimer = setTimeout(scheduleMelody, (total + 1.0) * 1000);
  }

  musicBtn.addEventListener('click', function () {
    musicOn = !musicOn;
    musicBtn.classList.toggle('playing', musicOn);

    if (musicOn) {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
        scheduleMelody();
      } catch (e) {
        musicOn = false;
        musicBtn.classList.remove('playing');
      }
    } else {
      clearTimeout(melodyTimer);
      if (audioCtx) {
        try { audioCtx.close(); } catch (e) {}
        audioCtx = null;
      }
    }
  });

    var fbEl  = cardEl.querySelector('.quiz-feedback');
    var scoreEl = cardEl.querySelector('.quiz-score b');

    for (var i = 0; i < opts.length; i++) {
      if (i !== idx && i !== data.answer) opts[i].classList.add('dimmed');
    }

    if (idx === data.answer) {
      opts[idx].classList.add('correct');
      quizState.score++;

      scoreEl.textContent = quizState.score;
      scoreEl.classList.add('bump');
      setTimeout(function () { scoreEl.classList.remove('bump'); }, 500);

      var rect = opts[idx].getBoundingClientRect();
      burst(rect.left + rect.width / 2, rect.top + rect.height / 2,
            ['#7dffcf', '#ffd166', '#ffffff', '#4ecdc4'], 36);

      fbEl.textContent = '✓ 太棒了！' + data.tip;
      fbEl.className = 'quiz-feedback good show';

    } else {
      opts[idx].classList.add('wrong');
      opts[data.answer].classList.add('correct');

      var rect2 = opts[data.answer].getBoundingClientRect();
      burst(rect2.left + rect2.width / 2, rect2.top + rect2.height / 2,
            ['#ff6b9d', '#ffd166', '#ffffff'], 20);

      fbEl.textContent = '✗ 没关系，' + data.tip;
      fbEl.className = 'quiz-feedback bad show';
    }

    setTimeout(function () {
      if (quizState.current < QUIZ_DATA.length - 1) {
        quizState.current++;
        quizState.locked = false;

        cardEl.animate([
          { transform: 'perspective(1200px) rotateX(0) scale(1)', opacity: 1 },
          { transform: 'perspective(1200px) rotateX(-32deg) scale(.9)', opacity: 0 }
        ], { duration: 300, easing: 'ease-in', fill: 'forwards' }).onfinish = function () {
          cardEl.style.transform = '';
          cardEl.style.opacity = '';
          cardEl.getAnimations().forEach(function (a) { a.cancel(); });
          renderQuestion(false);
          cardEl.animate([
            { transform: 'perspective(1200px) rotateX(32deg) scale(.9)', opacity: 0 },
            { transform: 'perspective(1200px) rotateX(0) scale(1)', opacity: 1 }
          ], { duration: 340, easing: 'ease-out' });
        };
      } else {
        showResult();
      }
    }, 1650);
  }

  function showResult() {
    var total = QUIZ_DATA.length;
    var score = quizState.score;
    var emoji, title, desc;

    if (score === total) {
      emoji = '🌟';
      title = '满分通关！姜程程太厉害了';
      desc = '李云祥为你准备的圣诞惊喜已经就绪。<br>点击下方按钮，解锁今晚的星光。';
    } else if (score >= total - 2) {
      emoji = '🎁';
      title = '答得很棒！圣诞老人为你点赞';
      desc = '礼物已备好，只等你亲手解开丝带。<br>点击下方，开启你的圣诞夜。';
    } else {
      emoji = '🎄';
      title = '没关系，快乐才是圣诞的第一道题';
      desc = '分数不重要，惊喜依然为你准备。<br>点击下方，让星光落在你身上。';
    }

    var btnsHtml;
    if (!unlocked) {
      btnsHtml =
        '<button class="unlock-btn">✨ 解锁圣诞惊喜 ✨</button>' +
        '<button class="again">再答一次</button>';
    } else {
      btnsHtml =
        '<button class="again">再答一次</button>' +
        '<button class="back">回到圣诞夜</button>';
    }

    cardEl.innerHTML = '' +
      '<div class="result">' +
        '<div class="result-emoji">' + emoji + '</div>' +
        '<div class="result-score">' + score + ' / ' + total + '</div>' +
        '<div class="result-title">' + title + '</div>' +
        '<div class="result-desc">' + desc + '</div>' +
        '<div class="result-sign">—— <b>李云祥</b> 敬上 ❤</div>' +
        '<div class="result-btns">' + btnsHtml + '</div>' +
      '</div>';

    confetti();
    setTimeout(confetti, 600);

    cardEl.querySelector('.again').addEventListener('click', function () {
      quizState = { current: 0, score: 0, locked: false };
      renderQuestion(true);
    });

    if (!unlocked) {
      cardEl.querySelector('.unlock-btn').addEventListener('click', unlock);
    } else {
      cardEl.querySelector('.back').addEventListener('click', function () {
        overlay.classList.remove('active');
      });
    }
  }

  /* =========================================================
     解锁惊喜
  ========================================================= */
  function unlock() {
    if (unlocked) return;
    unlocked = true;

    overlay.classList.remove('active');

    requestAnimationFrame(function () {
      document.body.classList.remove('locked');
      document.body.classList.add('unlocked');
    });

    burst(W / 2, H * 0.45,
      ['#ffd166', '#ff8ab8', '#ffffff', '#7dffcf', '#a78bfa', '#6bcbff'], 80);

    setTimeout(function () { confetti(); }, 500);
    setTimeout(function () { confetti(); }, 1200);

    // 停止浪漫粒子并清空
    setTimeout(function () {
      romanceActive = false;
      romanceCtx.clearRect(0, 0, W, H);
    }, 1500);

    setTimeout(function () {
      typeTick();
    }, 1800);
  }

  /* =========================================================
     启动
  ========================================================= */
  var resizeTimer;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 160);
  });
  window.addEventListener('orientationchange', function () {
    setTimeout(resize, 320);
  });

  resize();
  requestAnimationFrame(loop);

})();
</script>
</body>
</html>
